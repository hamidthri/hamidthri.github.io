<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1422"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="ht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cf2ea"/>
      <stop offset="1" stop-color="#16b8b0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.6" fill="none" stroke="#87b4e1" stroke-opacity="0.2"/>
  <!-- HT monogram (matches the nav mark) -->
  <g fill="url(#ht)">
    <!-- H -->
    <rect x="4.3" y="6" width="3.6" height="20"/>
    <rect x="12.3" y="6" width="3.6" height="20"/>
    <rect x="4.3" y="14.2" width="11.6" height="3.6"/>
    <!-- T -->
    <rect x="16.7" y="6" width="11" height="3.6"/>
    <rect x="20.4" y="6" width="3.6" height="20"/>
  </g>
</svg>
